name: Swap v0.2.1 macOS asset to v0.1.0 build

# One-off maintenance workflow: replace the freshly built macOS zip on the
# v0.2.1 release with the known-good ROOTBU-macos.zip from v0.1.0-alpha, so
# macOS users stay on the previously shipped build while Windows ships fresh.
# Runs on GitHub with the built-in GITHUB_TOKEN (no external auth needed).
# Delete this file once the swap has run successfully.

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/swap-mac-asset.yml"

permissions:
  contents: write

jobs:
  swap:
    runs-on: ubuntu-latest
    steps:
      - name: Download v0.1.0-alpha macOS build
        run: |
          curl -fL --retry 3 -o ROOTBU-macos.zip \
            https://github.com/${{ github.repository }}/releases/download/v0.1.0-alpha/ROOTBU-macos.zip
          ls -l ROOTBU-macos.zip

      - name: Replace macOS asset on the v0.2.1 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v0.2.1 ROOTBU-macos.zip --clobber --repo ${{ github.repository }}
          echo "Assets on v0.2.1 after swap:"
          gh release view v0.2.1 --repo ${{ github.repository }} --json assets \
            --jq '.assets[] | "\(.name) \(.size) bytes"'
