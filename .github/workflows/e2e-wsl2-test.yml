name: E2E WSL2 Test (Windows)

on:
  push:
    branches: ["e2e-wsl2-test"]
  workflow_dispatch:

jobs:
  e2e-windows:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Validate logic suite on runner
        shell: pwsh
        run: |
          python -B validate_rootbu.py
          python -m py_compile main.py installer.py root_installer.py rootbu_logic.py validate_rootbu.py ci_e2e.py

      - name: Hardware virtualization probe
        shell: pwsh
        run: |
          $cpu = Get-CimInstance Win32_Processor | Select-Object -First 1
          Write-Host "CPU: $($cpu.Name)"
          Write-Host "VT capable: $($cpu.VMMonitorModeExtensions)"
          Write-Host "SLAT: $($cpu.SecondLevelAddressTranslationExtensions)"
          Write-Host "Firmware VT enabled: $($cpu.VirtualizationFirmwareEnabled)"
          Write-Host "Hypervisor present: $((Get-CimInstance Win32_ComputerSystem).HypervisorPresent)"

      - name: Enable Windows features (WSL + Virtual Machine Platform)
        shell: pwsh
        run: |
          dism.exe /online /enable-feature /featurename:Microsoft-Windows-Subsystem-Linux /all /norestart
          Write-Host "WSL feature dism exit: $LASTEXITCODE"
          dism.exe /online /enable-feature /featurename:VirtualMachinePlatform /all /norestart
          Write-Host "VMP dism exit: $LASTEXITCODE"
          exit 0

      - name: Install Store WSL (no-reboot MSI with bundled kernel)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo microsoft/WSL --pattern "*.x64.msi" --dir $env:TEMP
          $msi = Get-ChildItem $env:TEMP -Filter "wsl*.x64.msi" | Select-Object -First 1
          Write-Host "Installing $($msi.FullName)"
          $p = Start-Process msiexec.exe -ArgumentList "/i","$($msi.FullName)","/quiet","/norestart" -Wait -PassThru
          Write-Host "msiexec exit: $($p.ExitCode)"
          wsl.exe --version
          exit 0

      - name: Import Ubuntu rootfs as WSL2 distro
        shell: pwsh
        run: |
          $urls = @(
            "https://cloud-images.ubuntu.com/wsl/noble/current/ubuntu-noble-wsl-amd64-24.04lts.rootfs.tar.gz",
            "https://cloud-images.ubuntu.com/wsl/jammy/current/ubuntu-jammy-wsl-amd64-ubuntu22.04lts.rootfs.tar.gz"
          )
          $rootfs = "$env:TEMP\ubuntu-rootfs.tar.gz"
          foreach ($url in $urls) {
            Write-Host "Trying $url"
            curl.exe -fsSL -o $rootfs $url
            if ($LASTEXITCODE -eq 0) { break }
          }
          if (-not (Test-Path $rootfs)) { Write-Host "rootfs download failed"; exit 1 }
          wsl.exe --set-default-version 2
          New-Item -ItemType Directory -Force C:\wsl-e2e | Out-Null
          wsl.exe --import Ubuntu C:\wsl-e2e $rootfs --version 2
          Write-Host "import exit: $LASTEXITCODE"
          exit 0

      - name: Boot verdict — can this runner start a WSL2 VM?
        id: verdict
        shell: pwsh
        run: |
          $uname = (wsl.exe -d Ubuntu -- uname -r) -join " "
          $code = $LASTEXITCODE
          Write-Host "uname exit=$code output=$uname"
          wsl.exe -l -v
          if ($code -eq 0 -and $uname -match "microsoft") {
            Write-Host "VERDICT: WSL2 boots on this runner"
            "wsl2_ok=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "VERDICT: WSL2 does NOT boot on this runner"
            "wsl2_ok=false" >> $env:GITHUB_OUTPUT
          }
          exit 0

      - name: Full E2E — drive the real ROOTBU plan chain to ROOT
        if: steps.verdict.outputs.wsl2_ok == 'true'
        shell: pwsh
        timeout-minutes: 150
        run: |
          python -B ci_e2e.py
          Write-Host "ci_e2e exit: $LASTEXITCODE"
          exit $LASTEXITCODE

      - name: Report skipped E2E
        if: steps.verdict.outputs.wsl2_ok != 'true'
        shell: pwsh
        run: |
          Write-Host "WSL2 VM could not start on this runner (no nested virtualization)."
          Write-Host "Everything before the VM boot was still exercised; see the logs above."
          exit 1
